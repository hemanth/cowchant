[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cowchant"
version = "0.1.0"
description = "🐄 Sanskrit chant TTS on the command line — powered by Vāgdhenu"
readme = "README.md"
authors = [{ name = "Hemanth HM", email = "hemanth.hm@gmail.com" }]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["sanskrit", "chant", "tts", "text-to-speech", "vedic", "shloka"]

dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchcodec",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "huggingface-hub>=0.20",
    "indic-transliteration>=2.3",
    "bigvgan",
    # IndicF5 transitive deps (IndicF5 is cloned at runtime, not pip-installable)
    "transformers>=4.40",
    "accelerate>=0.30",
    "vocos>=0.1",
    "x-transformers>=1.31",
    "torchdiffeq",
    "librosa",
    "matplotlib",
    "pydub",
    "safetensors",
    "ema-pytorch>=0.5.2",
    "tqdm>=4.65",
    "jieba",
    "pypinyin",
    "cached-path",
    "transformers-stream-generator",
    "wandb",
    "datasets",
    "hydra-core>=1.3",
]

[project.scripts]
cowchant = "cowchant.cli:main"

[project.urls]
Homepage = "https://github.com/hemanth/cowchant"
Repository = "https://github.com/hemanth/cowchant"
"Upstream (Vāgdhenu)" = "https://github.com/prathoshap/vagdhenu"

[tool.setuptools.packages.find]
where = ["src"]
